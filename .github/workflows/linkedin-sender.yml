name: LinkedIn sender (Browserbase)

# Machine-free scheduler. Runs often; the runner self-gates on /command/automation
# (enabled flag + work days/hours + pacing), so most invocations just exit immediately.
# Nothing is sent until you flip automation ON in the dashboard.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min (UTC); runner exits outside your PT hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse without clicking Send (DRY_RUN=1)"
        type: boolean
        default: true

concurrency:
  group: linkedin-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: linkedin-sender
        run: npm install --no-audit --no-fund
      - name: Run sender (then replies)
        working-directory: linkedin-sender
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
          BROWSERBASE_PROXY_COUNTRY: ${{ secrets.BROWSERBASE_PROXY_COUNTRY }}
          BROWSERBASE_PROXY_STATE: ${{ secrets.BROWSERBASE_PROXY_STATE }}
          BROWSERBASE_PROXY_CITY: ${{ secrets.BROWSERBASE_PROXY_CITY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node run-sender.mjs
          node run-replies.mjs
